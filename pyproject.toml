[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-docker-manager"
dynamic = ["version"]
description = "Keyboard-driven terminal interface for inspecting local Docker containers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hamid Arabnejad" },
]
requires-python = ">=3.9"
keywords = ["containers", "docker", "terminal", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "docker>=7.0.0",
    "platformdirs>=4.0.0",
    "urwid>=2.6.0",
]

[dependency-groups]
test = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]
dev = [
    { include-group = "test" },
    "bandit[toml]==1.8.6",
    "black==26.5.1",
    "build==1.4.4",
    "mypy==1.19.1",
    "pre-commit>=3.5,<5",
    "ruff==0.15.20",
    "twine==7.0.0",
]
security = [
    "pip-audit==2.10.1; python_version >= '3.10'",
]

[project.scripts]
edm = "easy_docker_manager.main:main"

[project.urls]
Homepage = "https://github.com/arabnejad/edm"
Issues = "https://github.com/arabnejad/edm/issues"
Repository = "https://github.com/arabnejad/edm"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["easy_docker_manager*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "S"]
ignore = ["S101", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.9"
files = ["src/easy_docker_manager"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["urwid", "urwid.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.bandit]
targets = ["src/easy_docker_manager"]
exclude_dirs = [".venv", "build", "dist"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
markers = [
    "integration: requires a running local Docker daemon",
    "smoke: checks package installation and basic startup",
]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "--cov=easy_docker_manager",
    "--cov-branch",
    "--cov-fail-under=95",
    "--cov-report=term-missing",
]
