name: Bug report
description: Report behavior that is broken or unexpected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove passwords, tokens,
        private container data, and other secrets before submitting this form.

  - type: input
    id: edm-version
    attributes:
      label: EDM version
      description: Run `python -m pip show easy-docker-manager` to find it.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - Other
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: Run `docker version` and provide the client and server versions.
      placeholder: Client 27.0.0, Server 27.0.0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that consistently shows the problem.
      placeholder: |
        1. Start EDM
        2. Select ...
        3. Press ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected EDM to do.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized terminal output or EDM log entries, if available.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed passwords, tokens, and other sensitive data.
          required: true
